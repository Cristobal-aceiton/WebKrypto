<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel WebKrypto</title>
<link rel="icon" href="logo/logo.png">
<style>
:root{--bg:#f2f6f6;--panel:#fff;--text:#132326;--muted:#5f7477;--line:#e1e8e8;--brand:#0d6e80;--brand2:#1e9494;--chip:#eef5f5;}
@media (prefers-color-scheme: dark){:root{--bg:#0f1a1c;--panel:#16262a;--text:#e8f1f1;--muted:#93a7aa;--line:#233436;--chip:#1c2e30;}}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
header{position:sticky;top:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;z-index:20;}
header h1{font-size:18px;margin:0;}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:none;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;}
.btn-primary{background:#35dd14;color:#0d3d1a;} .btn-primary:hover{background:#2ec00f;}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;}
.btn-secundario{background:var(--chip);color:var(--text);} .btn-peligro{background:#fbdada;color:#a11c11;}
main{max-width:1200px;margin:0 auto;padding:28px 24px;}
#login{max-width:360px;margin:60px auto;background:var(--panel);border-radius:12px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
#login h2{color:var(--brand);margin-top:0;}
#login label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;}
#login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);}
#login .error{color:#d93025;font-size:13px;margin-top:10px;min-height:16px;}
#app{display:none;}
#alertas{margin-bottom:24px;}
.alerta{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border-left:4px solid #e2a300;border-radius:8px;padding:14px 18px;margin-bottom:12px;font-size:13px;}
.alerta.vencido{border-left-color:#d93025;} .alerta b{display:block;font-size:14px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:28px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
.kpi small{color:var(--muted);font-size:12px;font-weight:600;display:block;} .kpi b{font-size:22px;display:block;margin:2px 0;} .kpi span{font-size:12px;color:var(--muted);}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;}
.tab.act{background:var(--brand);color:#fff;border-color:var(--brand);}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
.toolbar .meta{margin:0;}
input[type=search],select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:14px;}

.tabla-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--panel);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1150px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th[data-sort]{cursor:pointer;user-select:none;} th[data-sort]:hover{color:var(--brand);}
tbody tr:hover{background:var(--chip);cursor:pointer;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.b-pend,.b-pagpar{background:#fdecc8;color:#8a5a00;} .b-conc,.b-pagok{background:#d7f5df;color:#146c34;}
.b-noconc,.b-pagpend{background:#fbdada;color:#a11c11;} .b-canc{background:#e4e4e4;color:#555;} .b-nuevo{background:#dbeafe;color:#1d4ed8;margin-left:6px;}
.origen{font-size:11px;color:var(--muted);} .vacio{padding:40px;text-align:center;color:var(--muted);}
.tablero{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:20px;overflow-x:auto;align-items:start;}
.col{background:var(--chip);border-radius:12px;padding:16px;min-height:120px;}
.col h3{font-size:13px;margin:0 0 16px;display:flex;justify-content:space-between;gap:6px;} .col h3 span{color:var(--muted);font-weight:500;}
.col.sobre{outline:2px dashed var(--brand);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;cursor:pointer;font-size:13px;}
.card .sub{color:var(--muted);font-size:12px;margin-top:6px;} .card select{margin-top:8px;width:100%;padding:5px;font-size:12px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;} .stat h3{margin:0 0 16px;font-size:14px;color:var(--brand);}
.barra{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;font-size:12px;margin-bottom:12px;}
.barra i{display:block;height:10px;border-radius:5px;background:var(--brand2);min-width:2px;} .barra em{font-style:normal;color:var(--muted);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;}
.overlay.abierto{display:flex;}
.modal{background:var(--panel);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;}
.modal h2{margin:0 0 12px;font-size:18px;color:var(--brand);}
.rapidas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;} .rapidas .btn{font-size:13px;padding:7px 12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;} @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
.campo{margin-bottom:12px;} .campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:12px;} legend{font-size:12px;font-weight:700;color:var(--brand2);padding:0 6px;}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;}
.modal-acciones{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;}
.adjuntos a{display:inline-block;margin:2px 8px 2px 0;font-size:12px;color:var(--brand);}
dl.datos{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin:0;} dl.datos dt{color:var(--muted);font-weight:600;} dl.datos dd{margin:0;word-break:break-word;}
.nota{background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;position:relative;} .nota small{color:var(--muted);display:block;}
.nota p{margin:2px 0 0;white-space:pre-wrap;padding-right:24px;} .nota button{position:absolute;top:6px;right:6px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;}
.meta{font-size:11px;color:var(--muted);margin-bottom:10px;}
details.crudo{margin-top:6px;font-size:12px;color:var(--muted);} details.crudo pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;}

:root{--brand:#0e7490;--brand2:#14a3a3;--shadow:0 1px 2px rgba(16,40,44,.05),0 4px 14px rgba(16,40,44,.07);--r:14px;}
@media (prefers-color-scheme: dark){:root{--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}}
body{-webkit-font-smoothing:antialiased;}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none;}
header{box-shadow:0 2px 14px rgba(6,60,70,.28);} header h1{display:flex;align-items:center;gap:10px;letter-spacing:.2px;}
.btn{display:inline-flex;align-items:center;gap:7px;transition:transform .1s,background .15s,box-shadow .15s;} .btn:hover{transform:translateY(-1px);} .btn:active{transform:none;}
.btn-ghost:hover{background:rgba(255,255,255,.28);} .btn-primary{box-shadow:0 2px 8px rgba(53,221,20,.3);}
#login{border-radius:16px;box-shadow:var(--shadow);} #login h2{display:flex;align-items:center;gap:10px;}
.kpi{position:relative;box-shadow:var(--shadow);transition:transform .15s;} .kpi:hover{transform:translateY(-2px);}
.kpi-ic{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;background:var(--chip);color:var(--brand);display:grid;place-items:center;font-size:17px;}
.kpi small{text-transform:uppercase;letter-spacing:.5px;font-size:11px;padding-right:46px;} .kpi b{font-size:26px;margin:8px 0 4px;letter-spacing:-.5px;}
.alerta{box-shadow:var(--shadow);}
.tabs{background:var(--chip);padding:5px;border-radius:12px;gap:4px;width:max-content;max-width:100%;overflow-x:auto;}
.tab{display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;color:var(--muted);transition:all .15s;} .tab:hover{color:var(--text);}
.tab.act{background:var(--panel);color:var(--brand);box-shadow:var(--shadow);}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);}
.busca{position:relative;flex:1;min-width:240px;} .busca .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
#buscar{width:100%;padding-left:38px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,163,163,.2);}
.tabla-wrap{border-radius:var(--r);box-shadow:var(--shadow);}
thead th{background:var(--chip);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:12px;padding-bottom:12px;}
td{padding-top:14px;padding-bottom:14px;} tbody tr{transition:background .12s;} tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;gap:6px;} .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.col{border-top:3px solid var(--line);} .col[data-estado="Pendiente"]{border-top-color:#e2a300;} .col[data-estado="Concretado"]{border-top-color:#22a35a;} .col[data-estado="No concretado"]{border-top-color:#d93025;} .col[data-estado="Cancelado"]{border-top-color:#8b9a9c;}
.card{box-shadow:var(--shadow);transition:transform .15s;} .card:hover{transform:translateY(-2px);}
.stat{box-shadow:var(--shadow);} .barra i{background:linear-gradient(90deg,var(--brand),var(--brand2));}
.overlay{backdrop-filter:blur(3px);} .modal{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal h2{font-size:20px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.nota button{display:grid;place-items:center;width:24px;height:24px;} .nota button:hover{color:#d93025;}
</style>
</head>
<body>

0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol><symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol><symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></symbol><symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol><symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol></defs></svg>

<div id="login">
  <h2><svg class="i"><use href="#i-chart"/></svg> Panel WebKrypto</h2>
  <form id="formLogin">
    <label>Correo</label><input type="email" id="loginCorreo" required autocomplete="email">
    <label>Contraseña</label><input type="password" id="loginPass" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:18px;">Entrar</button>
    <div class="error" id="loginError"></div>
  </form>
</div>

<div id="app">
<header>
 <h1><svg class="i"><use href="#i-chart"/></svg> Panel WebKrypto</h1>
 <div class="hbtns">
   <button class="btn btn-ghost" id="btnActualizar"><svg class="i"><use href="#i-refresh"/></svg> Actualizar</button>
   <button class="btn btn-ghost" id="btnCsv"><svg class="i"><use href="#i-download"/></svg> Exportar CSV</button>
   <button class="btn btn-primary" id="btnNuevo"><svg class="i"><use href="#i-plus"/></svg> Nuevo cliente</button>
   <button class="btn btn-ghost" id="btnSalir"><svg class="i"><use href="#i-logout"/></svg> Salir</button>
 </div>
</header>
<main>
 <div class="kpis" id="kpis"></div>
 <div id="alertas"></div>
 <div class="tabs">
   <button class="tab act" data-vista="tabla"><svg class="i"><use href="#i-list"/></svg> Tabla</button>
   <button class="tab" data-vista="tablero"><svg class="i"><use href="#i-board"/></svg> Tablero</button>
   <button class="tab" data-vista="stats"><svg class="i"><use href="#i-trend"/></svg> Estadísticas</button>
 </div>
 <div class="toolbar" id="toolbar">
   <div class="busca"><svg class="i"><use href="#i-search"/></svg><input type="search" id="buscar" placeholder="Buscar por negocio, contacto, correo, WhatsApp, plan, notas..."></div>
   <select id="filtroEstado"><option value="">Todos los estados</option><option>Pendiente</option><option>Concretado</option><option>No concretado</option><option>Cancelado</option></select>
   <select id="filtroPago"><option value="">Todos los pagos</option><option>Pendiente</option><option>Parcial</option><option>Pagado</option></select>
   <select id="filtroPlan"><option value="">Todos los planes</option></select>
   <select id="filtroOrigen"><option value="">Todos los orígenes</option><option value="formulario">Web</option><option value="manual">Manual</option></select>
   <select id="filtroPeriodo"><option value="">Todo el tiempo</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Último año</option></select>
   <select id="filtroExtra"><option value="">Sin filtro extra</option><option value="venc">Vencen en 30 días o vencidos</option><option value="mant">Mantención activa</option><option value="cobrar">Con saldo por cobrar</option><option value="nuevo">Solo leads nuevos</option></select>
   <button class="btn btn-secundario" id="btnLimpiar"><svg class="i"><use href="#i-x"/></svg> Limpiar</button><span class="meta" id="contador"></span>
 </div>
 <div id="vTabla" class="tabla-wrap">
  <table>
   <thead><tr><th data-sort="negocio">Negocio</th><th data-sort="contacto">Contacto</th><th data-sort="ciudad">Ciudad</th><th data-sort="plan">Plan</th><th data-sort="estado">Estado</th><th data-sort="pago">Pago</th><th data-sort="monto">Monto</th><th data-sort="saldo">Saldo</th><th data-sort="venc">Próx. vencimiento</th><th data-sort="creado">Creado</th><th>Origen</th></tr></thead>
   <tbody id="filas"></tbody>
  </table>
  <div class="vacio" id="vacio" hidden>No hay clientes que coincidan.</div>
 </div>
 <div id="vTablero" class="tablero" hidden></div>
 <div id="vStats" class="stats" hidden></div>
</main>
</div>

<div class="overlay" id="overlay">
 <div class="modal">
  <h2 id="modalTitulo">Nuevo cliente</h2>
  <div class="rapidas" id="rapidas"></div>
  <div class="meta" id="metaCliente"></div>
  <form id="form">
   <fieldset><legend>Datos del cliente</legend>
    <div class="grid2">
     <div class="campo"><label>Negocio *</label><input name="nombre_negocio" required></div>
     <div class="campo"><label>Contacto</label><input name="nombre_contacto"></div>
     <div class="campo"><label>WhatsApp</label><input name="whatsapp"></div>
     <div class="campo"><label>Correo</label><input type="email" name="correo"></div>
    </div>
   </fieldset>
   <fieldset><legend>Trato</legend>
    <div class="grid2">
     <div class="campo"><label>Plan</label>
       <select name="plan"><option>Por definir</option><option>Landing Page</option><option>Página Web Profesional</option><option>Otro</option></select></div>
     <div class="campo"><label>Estado del trato</label>
       <select name="estado"><option>Pendiente</option><option>Concretado</option><option>No concretado</option><option>Cancelado</option></select></div>
     <div class="campo"><label>Monto total ($)</label><input type="number" name="monto_total" min="0"></div>
     <div class="campo"><label>Estado de pago</label>
       <select name="pago_estado"><option>Pendiente</option><option>Parcial</option><option>Pagado</option></select></div>
     <div class="campo"><label>Monto pendiente ($)</label><input type="number" name="monto_pendiente" min="0"></div>
    </div>
   </fieldset>
   <fieldset><legend>Mantención</legend>
    <div class="check"><input type="checkbox" name="mantencion_activa" id="mantActiva"><label for="mantActiva">Mantención activa</label></div>
    <div class="grid2">
     <div class="campo"><label>Precio mensual ($)</label><input type="number" name="mantencion_precio" min="0"></div>
     <div class="campo"><label>Próximo vencimiento</label><input type="date" name="mantencion_vencimiento"></div>
    </div>
   </fieldset>
   <fieldset><legend>Hosting y dominio</legend>
    <div class="grid2">
     <div class="campo"><label>Proveedor hosting</label><input name="hosting_proveedor"></div>
     <div class="campo"><label>Vencimiento hosting</label><input type="date" name="hosting_vencimiento"></div>
     <div class="campo"><label>Dominio</label><input name="dominio_nombre"></div>
     <div class="campo"><label>Vencimiento dominio</label><input type="date" name="dominio_vencimiento"></div>
    </div>

/* ---------- Modal ---------- */
var ETQ = { rubro: 'Rubro', ciudad: 'Ciudad / comuna', redes_sociales: 'Redes sociales', medio_cotizacion: 'Medio para cotización', medio_cotizacion_otro: 'Otro medio', horario_preferido: 'Horario preferido', sobre_negocio: 'Sobre el negocio', objetivo: 'Objetivo', objetivo_otro: 'Otro objetivo', secciones: 'Secciones', secciones_otra: 'Otra sección', funciones: 'Funciones', funciones_otra: 'Otra función', tiene_dominio: '¿Tiene dominio?', dominio: 'Dominio', tiene_hosting: '¿Tiene hosting?', fecha_publicacion: '¿Fecha de publicación?', fecha_publicacion_valor: 'Fecha deseada', info_adicional: 'Info adicional', acepta_politicas: 'Aceptó privacidad y términos' };
function urlSegura(u) { return /^https?:\/\//i.test(String(u)); }
function renderNotas() {
  $('#listaNotas').innerHTML = notas.map(function (n, i) { return { n: n, i: i }; }).reverse().map(function (x) {
    return '<div class="nota"><small>' + escapeHtml(new Date(x.n.fecha).toLocaleString('es-CL')) + '</small><p>' + escapeHtml(x.n.texto) + '</p><button type="button" data-i="' + x.i + '" title="Borrar nota">' + ico('x') + '</button></div>';
  }).join('') || '<div class="meta">Aún no hay notas adicionales.</div>';
}
async function guardarNotas() {
  if (!clienteEditando) return true;
  var r = await sb.from('clientes').update({ notas_historial: notas }).eq('id', clienteEditando);
  if (r.error) { alert('No se pudo guardar la nota. ¿Ejecutaste migracion_panel.sql en Supabase?\n' + r.error.message); return false; }
  var d = clientes.find(function (x) { return x.id === clienteEditando; }); if (d) d.notas_historial = notas.slice(); render(); return true;
}
$('#btnNota').addEventListener('click', async function () {
  var t = $('#notaNueva').value.trim(); if (!t) return;
  notas.push({ fecha: new Date().toISOString(), texto: t });
  if (await guardarNotas()) { $('#notaNueva').value = ''; renderNotas(); } else notas.pop();
});
$('#listaNotas').addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b || !confirm('¿Borrar esta nota?')) return;
  var quitada = notas.splice(Number(b.dataset.i), 1); if (await guardarNotas()) renderNotas(); else { notas.push(quitada[0]); renderNotas(); }
});
function abrirModal(c) {
  clienteEditando = c ? c.id : null; notas = c && Array.isArray(c.notas_historial) ? c.notas_historial.slice() : [];
  $('#modalTitulo').textContent = c ? 'Editar cliente' : 'Nuevo cliente'; $('#btnEliminar').hidden = !c;
  form.reset(); $('#notaNueva').value = ''; $('#cajaAdjuntos').hidden = true; $('#cajaCrudo').hidden = true; $('#cajaForm').hidden = true;
  $('#rapidas').innerHTML = ''; $('#metaCliente').textContent = '';
  if (c) {
    var sel = form.elements.plan; if (c.plan && !Array.prototype.some.call(sel.options, function (o) { return o.value === c.plan; })) sel.add(new Option(c.plan, c.plan));
    Object.keys(c).forEach(function (k) { var el = form.elements[k]; if (!el) return; if (el.type === 'checkbox') el.checked = !!c[k]; else el.value = c[k] == null ? '' : c[k]; });
    var wa = String(c.whatsapp || '').replace(/\D/g, ''); if (wa.length === 9 && wa[0] === '9') wa = '56' + wa;
    $('#rapidas').innerHTML = (wa.length >= 8 ? '<a class="btn btn-secundario" target="_blank" rel="noopener" href="https://wa.me/' + wa + '">' + ico('message') + ' WhatsApp</a>' : '') + (c.correo ? '<a class="btn btn-secundario" href="mailto:' + escapeHtml(c.correo) + '">' + ico('mail') + ' Correo</a>' : '');
    $('#metaCliente').textContent = 'Creado: ' + fechaCL(c.creado_at) + ' · Última modificación: ' + fechaCL(c.actualizado_at) + ' · Origen: ' + (c.origen === 'formulario' ? 'Web' : 'Manual');
    if (c.archivos && Object.keys(c.archivos).length) {
      $('#listaAdjuntos').innerHTML = Object.keys(c.archivos).map(function (campo) {
        var v = c.archivos[campo], urls = Array.isArray(v) ? v : [v];
        return urls.filter(urlSegura).map(function (u, i) { return '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">' + escapeHtml(campo) + (urls.length > 1 ? ' ' + (i + 1) : '') + '</a>'; }).join('');
      }).join(''); $('#cajaAdjuntos').hidden = false;
    }
    var f = c.formulario;
    if (f && Object.keys(f).length) {
      $('#datosForm').innerHTML = Object.keys(ETQ).filter(function (k) { var v = f[k]; return v && (!Array.isArray(v) || v.length); })
        .map(function (k) { return '<dt>' + ETQ[k] + '</dt><dd>' + escapeHtml(Array.isArray(f[k]) ? f[k].join(', ') : f[k]) + '</dd>'; }).join('');
      $('#cajaForm').hidden = !$('#datosForm').innerHTML; $('#formularioCrudo').textContent = JSON.stringify(f, null, 2); $('#cajaCrudo').hidden = false;
    }
  }
  renderNotas(); overlay.classList.add('abierto');
}
function cerrarModal() { overlay.classList.remove('abierto'); clienteEditando = null; }
$('#btnNuevo').addEventListener('click', function () { abrirModal(null); });
$('#btnCancelar').addEventListener('click', cerrarModal);
overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrarModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('abierto')) cerrarModal(); });

/* ---------- Guardar / eliminar ---------- */
var CAMPOS_FORM = ['nombre_negocio', 'nombre_contacto', 'whatsapp', 'correo', 'plan', 'estado', 'monto_total', 'pago_estado', 'monto_pendiente', 'mantencion_activa', 'mantencion_precio', 'mantencion_vencimiento', 'hosting_proveedor', 'hosting_vencimiento', 'dominio_nombre', 'dominio_vencimiento', 'notas'];
form.addEventListener('submit', async function (e) {
  e.preventDefault(); var datos = {};
  CAMPOS_FORM.forEach(function (n) { var el = form.elements[n]; if (!el) return; datos[n] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? (el.value === '' ? 0 : Number(el.value)) : (el.value || null)); });
  try {
    var r = clienteEditando ? await sb.from('clientes').update(datos).eq('id', clienteEditando)
      : await sb.from('clientes').insert(Object.assign({ origen: 'manual' }, datos, notas.length ? { notas_historial: notas } : {}));
    if (r.error) throw r.error; cerrarModal(); cargarClientes();
  } catch (err) { alert('No se pudo guardar: ' + (err && err.message ? err.message : err)); }
});
$('#btnEliminar').addEventListener('click', async function () {
  if (!clienteEditando || !confirm('¿Eliminar este cliente? Esta acción no se puede deshacer.')) return;
  var r = await sb.from('clientes').delete().eq('id', clienteEditando);
  if (r.error) { alert('No se pudo eliminar.'); return; } cerrarModal(); cargarClientes();
});

/* ---------- Carga ---------- */
async function cargarClientes() {
  var r = await sb.from('clientes').select('*').order('creado_at', { ascending: false }).limit(1000);
  if (r.error) { console.error(r.error); return; }
  clientes = (r.data || []).map(function (d) { d.estado = d.estado || 'Pendiente'; return d; }); poblarPlanes(); render();
}
$('#btnActualizar').addEventListener('click', cargarClientes);
setInterval(function () { if ($('#app').style.display === 'block' && !arrastrando && !overlay.classList.contains('abierto')) cargarClientes(); }, 30000);
sb.auth.getSession().then(function (r) { if (r.data && r.data.session) { $('#login').style.display = 'none'; $('#app').style.display = 'block'; cargarClientes(); } });
</script>
</body>
</html>
